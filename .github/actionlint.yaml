# actionlint's settings, for checking the workflows on a Mac (CI doesn't run
# it). Labels actionlint doesn't know:
# - xcode-27: GitHub's machine for Release iOS (macOS 27 with Xcode 27, a
#   GitHub-hosted public preview as of 2026-11-20), named here even though
#   it isn't self-hosted. Drop it when Release iOS moves to macos-27.
# - battleplan: the owner's Mac, a self-hosted runner set up by
#   tools/setup_mac_runner.sh (ROADMAP task 485).
self-hosted-runner:
  labels:
    - xcode-27
    - battleplan
