# Release iOS: builds the iPhone and iPad app for prod (app.getbattleplan)
# and uploads it to TestFlight in App Store Connect (ROADMAP task 209). Start
# it from the Actions tab, on main; starting it is the approval. From
# TestFlight the build goes to testers (task 211), and later to App Review
# (task 133). The server and the web app go out with Release to prod.
#
# Signing is automatic: Xcode signs in to App Store Connect with the API key
# in the APP_STORE_CONNECT_* secrets and makes or reuses the distribution
# certificate and profile, so no certificate or profile is kept anywhere.
# The archive is signed with an Apple Development certificate that Xcode
# makes on each run ("Created via API"), since the machine starts empty;
# Apple allows only so many, so the run revokes those before the archive and
# after the upload (tools/revoke_ci_certificates.py, ROADMAP task 382).
# It runs on GitHub's macOS machines, whose minutes count 10 times against
# the repo's Actions minutes (it's private), so it runs only when started.
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: Release without waiting for CI to pass on this commit
        type: boolean
        default: false

env:
  # The same Flutter as ci.yml and release.yml.
  FLUTTER_VERSION: 3.50.0
  # The Apple Developer team (individual membership).
  TEAM_ID: 885XHF7XLL
  # Analytics without the advertising ID (Info.plist, store checklist 3.3).
  # firebase_analytics' Package.swift reads it when Xcode resolves packages,
  # which the archive does, so it's set for the whole run.
  FIREBASE_ANALYTICS_WITHOUT_ADID: 'true'

jobs:
  # On Linux, where minutes are cheap: wait for CI before paying for macOS.
  checks:
    name: Ready to release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
    steps:
      - name: Release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::iOS releases come from main (this is ${GITHUB_REF_NAME})."
          exit 1

      - name: Skipping the CI check, as asked
        if: ${{ inputs.skip_ci_check }}
        run: echo "::warning::Releasing ${GITHUB_SHA:0:7} without checking CI (skip_ci_check)."

      - name: CI passed on this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest CI run on this commit, waiting while it runs.
          for _ in $(seq 1 120); do
            ci=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml \
              --limit 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$ci" in
              "completed success") echo "CI passed on ${GITHUB_SHA:0:7}."; exit 0 ;;
              completed*) echo "::error::CI didn't pass on ${GITHUB_SHA:0:7} ($ci)."; exit 1 ;;
              "") echo "::error::CI hasn't run on ${GITHUB_SHA:0:7}. Push it to main, or run with skip_ci_check."; exit 1 ;;
              *) echo "CI is ${ci%% *} on ${GITHUB_SHA:0:7}; waiting."; sleep 30 ;;
            esac
          done
          echo "::error::CI didn't finish within an hour."
          exit 1

  release:
    name: Build and upload to TestFlight
    needs: checks
    # macOS 26 with Xcode 26: App Store uploads need the iOS 26 SDK or later
    # (store checklist 3.3).
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    # One upload at a time; a second waits for the first.
    concurrency:
      group: release-ios
      cancel-in-progress: false
    steps:
      # The whole history: the build number counts the commits (ARCH §9), the
      # same number the web app shows for this commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Xcode
        run: xcodebuild -version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: App Store Connect key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/asc_key.p8"

      # Writes the flavor, entry point, build number, and commit into
      # ios/Flutter/Generated.xcconfig and installs the pods, without
      # compiling: the archive below compiles everything once, the Dart code
      # included. (Until 2026-11-12 this was a full build that the archive
      # then redid, about 10 of the run's 25 minutes.)
      - name: Configure for prod
        run: |
          build_number=$(git rev-list --count HEAD)
          commit=$(git rev-parse --short=7 HEAD)
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Configuring prod build $build_number ($commit)."
          flutter build ios --config-only --release --flavor prod -t lib/main_prod.dart \
            --build-number="$build_number" --dart-define=APP_COMMIT="$commit"

      # Earlier runs' "Created via API" development certificates, whose
      # machines are gone; until 2026-11-12 every run left one, and they
      # filled the account. Only those: never a distribution or Developer ID
      # certificate, or one made in Xcode on a Mac. A failure only warns.
      - name: Revoke earlier runs' development certificates
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 tools/revoke_ci_certificates.py

      # Compiles the app and its plugins (Firebase's C++ is most of it) and
      # signs it. -quiet keeps the log to warnings and errors; without it,
      # every compile prints its full command and settings, 20,000 lines.
      - name: Archive, signed for the App Store
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive -quiet \
            -workspace ios/Runner.xcworkspace -scheme prod -configuration Release-prod \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Battleplan.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      # Exporting with destination "upload" (ios/ExportOptions-AppStore.plist)
      # signs the app for distribution and uploads it to App Store Connect.
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Battleplan.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-AppStore.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      # The one the archive made, whose private key goes with this machine.
      # The uploaded build is signed for distribution, so it isn't affected.
      - name: Revoke this run's development certificate
        if: always()
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 tools/revoke_ci_certificates.py

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"

      - name: Summary
        run: |
          echo "Uploaded prod build **$BUILD_NUMBER** (\`${GITHUB_SHA:0:7}\`) to App Store Connect. It shows in TestFlight once Apple finishes processing it, usually within an hour." >> "$GITHUB_STEP_SUMMARY"
