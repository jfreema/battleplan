# Releases one commit to dev or prod: Firestore rules and indexes, Storage
# rules, Functions, and the Hosting site (the website, and the web app at
# /app). Release to dev (release-dev.yml) and Release to prod
# (release-prod.yml) call it; it isn't started on its own.
#
# It releases only a commit CI passed on, waiting for CI if it's still
# running, unless skip_ci_check is set. Deploy access is keyless (Workload
# Identity Federation, set up by tools/setup_github_deploys.sh).
#
# Only the deploy job can get into Google, so only it may ask GitHub for a
# login token (id-token: write). It runs nothing but GitHub's and Google's
# own actions, pinned to commits, and the Firebase CLI at an exact version;
# the Flutter build, with its third-party action, runs in a job that can't.
name: Release (shared steps, not run on its own)

on:
  workflow_call:
    inputs:
      flavor:
        description: dev or prod
        required: true
        type: string
      skip_ci_check:
        description: Release without waiting for CI to pass on this commit
        required: false
        type: boolean
        default: false

env:
  # The same Flutter as ci.yml.
  FLUTTER_VERSION: 3.47.6

jobs:
  # Its own job, outside the deploy lock: CI's deploy to dev takes that lock
  # too, and waiting for CI while holding it would wait forever.
  checks:
    name: Ready to release
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
    steps:
      - name: Release from main
        if: inputs.flavor == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod releases come from main (this is ${GITHUB_REF_NAME})."
          exit 1

      - name: CI passed on this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest CI run on this commit, waiting while it runs.
          for _ in $(seq 1 120); do
            ci=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml \
              --limit 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$ci" in
              "completed success") echo "CI passed on ${GITHUB_SHA:0:7}."; exit 0 ;;
              completed*) echo "::error::CI didn't pass on ${GITHUB_SHA:0:7} ($ci)."; exit 1 ;;
              "") echo "::error::CI hasn't run on ${GITHUB_SHA:0:7}. Push it to main, or run with skip_ci_check."; exit 1 ;;
              *) echo "CI is ${ci%% *} on ${GITHUB_SHA:0:7}; waiting."; sleep 30 ;;
            esac
          done
          echo "::error::CI didn't finish within an hour."
          exit 1

  build:
    name: Build the site for ${{ inputs.flavor }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Hosting build (website + web app under /app)
        env:
          # Not secrets: the reCAPTCHA site key for App Check once there is
          # one, and the Apple team for apple-app-site-association.
          APP_CHECK_WEB_KEY: ${{ inputs.flavor == 'prod' && vars.APP_CHECK_WEB_KEY_PROD || vars.APP_CHECK_WEB_KEY_DEV }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: tools/build_hosting.sh "${{ inputs.flavor }}" ${APP_CHECK_WEB_KEY:+--dart-define=APP_CHECK_WEB_KEY=$APP_CHECK_WEB_KEY}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosting-${{ inputs.flavor }}
          path: build/hosting
          include-hidden-files: true
          retention-days: 3

  release:
    name: Release to ${{ inputs.flavor }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # One deploy at a time per project, CI's deploy to dev included; a
    # release waits for the one before it rather than canceling it.
    concurrency:
      group: deploy-${{ inputs.flavor }}
      cancel-in-progress: false
    env:
      PROJECT: ${{ inputs.flavor == 'prod' && 'battleplan-prod' || 'battleplan-dev-ecce4' }}
      SITE: ${{ inputs.flavor == 'prod' && 'https://getbattleplan.app' || 'https://battleplan-dev-ecce4.web.app' }}
      FIREBASE: npx --yes firebase-tools@15.33.0
      # No package's install scripts run here, the Firebase CLI's included:
      # none is needed to deploy (a dry run checks it), and none gets the
      # chance to ask for a login token. `npm run` scripts still run.
      npm_config_ignore_scripts: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # From the lockfile. Functions don't need @firebase/util's and
      # protobufjs's install scripts.
      - name: Functions dependencies
        run: npm ci --prefix functions
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hosting-${{ inputs.flavor }}
          path: build/hosting

      # Where to log in: each project's GitHub trust and deploy account, made
      # once by tools/setup_github_deploys.sh. Not secrets.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ inputs.flavor == 'prod' && '628123687470' || '814215990622' }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com

      # Rules first, then Functions, then the app, so the new app never
      # calls a function that isn't there yet.
      - name: Deploy Firestore rules and indexes, and Storage rules
        run: $FIREBASE deploy --only firestore:rules,firestore:indexes,storage --project "$PROJECT" --non-interactive

      - name: Deploy Functions
        run: |
          # Deploying many functions at once can hit Google's quota for a
          # minute; unchanged functions are skipped on the next try.
          for attempt in 1 2 3; do
            if $FIREBASE deploy --only functions --project "$PROJECT" --non-interactive \
              --message "Release ${GITHUB_SHA:0:7}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Functions deploy failed (try $attempt of 3); trying again in 90 seconds."
              sleep 90
            fi
          done
          exit 1

      - name: Deploy Hosting
        run: $FIREBASE deploy --only hosting --project "$PROJECT" --non-interactive --message "Release ${GITHUB_SHA:0:7}"

      - name: Summary
        run: |
          echo "Released \`${GITHUB_SHA:0:7}\` to **$PROJECT**: $SITE (app at $SITE/app/)." >> "$GITHUB_STEP_SUMMARY"
