# Records the test-font goldens (test/goldens/ci) on Linux, the system CI
# compares them on, and commits them to the branch it runs on. Run it from
# the Actions tab after an intended layout change (docs/a11y-perf.md).
# Pushes made with the GITHUB_TOKEN don't start other workflows, so CI runs
# again on the next push.
name: Update goldens

on:
  workflow_dispatch:

concurrency:
  group: update-goldens-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same Flutter as ci.yml.
  FLUTTER_VERSION: 3.47.6

jobs:
  goldens:
    name: Record the CI goldens on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code
        run: |
          dart run build_runner build
          flutter gen-l10n
      - name: Record the goldens
        run: flutter test --tags golden --update-goldens test/goldens/screens_golden_test.dart
      - name: Commit them
        run: |
          git add test/goldens/ci/*.png
          if git diff --cached --quiet; then
            echo "The goldens are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Goldens: record the CI baselines on Linux"
          git push origin "HEAD:${GITHUB_REF_NAME}"
