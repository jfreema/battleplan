# Android build: the Android app, built here and never on a developer's Mac
# (store checklist 1.11). Start it from the Actions tab. It makes:
#   - an App Bundle (.aab) for Google Play,
#   - an APK to install on a phone or emulator for testing,
# both signed with the Play upload key from the repository's secrets, and
# with "End-to-end test APK" ticked, a debug APK that runs
# integration_test/e2e_test.dart against the Firebase emulators on the Mac
# whose Android emulator installs it (store checklist 1.13).
# Download them from the run's Artifacts. Release Android
# (release-android.yml) runs this for prod and uploads the App Bundle to
# Google Play (store checklist 4.2, ROADMAP task 214).
name: Android build

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which app
        type: choice
        options: [dev, prod]
        default: dev
      e2e:
        description: End-to-end test APK too (dev only)
        type: boolean
        default: false
  # Release Android builds prod with this and uploads the App Bundle.
  workflow_call:
    inputs:
      flavor:
        type: string
        default: prod
      e2e:
        type: boolean
        default: false
    outputs:
      artifact:
        description: The artifact holding the App Bundle and APK
        value: ${{ jobs.build.outputs.artifact }}
      build_number:
        description: The build number (the commit count)
        value: ${{ jobs.build.outputs.build_number }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  FLAVOR: ${{ inputs.flavor }}

jobs:
  build:
    name: Build (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: battleplan-android-${{ inputs.flavor }}-${{ steps.build.outputs.build_number }}
      build_number: ${{ steps.build.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, as on the web.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$FLAVOR" = prod ]; then
              echo "::error::No ANDROID_UPLOAD_KEYSTORE_BASE64 secret: a prod build must be signed with the upload key."
              exit 1
            fi
            echo "::warning::No upload key in the repository's secrets, so this is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Build the App Bundle and APK
        id: build
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          build_number=$(git rev-list --count HEAD)
          commit=$(git rev-parse --short HEAD)
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          for target in appbundle apk; do
            flutter build "$target" --release --flavor "$FLAVOR" \
              -t "lib/main_$FLAVOR.dart" --build-number="$build_number" \
              --dart-define=APP_COMMIT="$commit"
          done

      - name: Check the signature
        run: |
          aab="build/app/outputs/bundle/${FLAVOR}Release/app-$FLAVOR-release.aab"
          apk="build/app/outputs/flutter-apk/app-$FLAVOR-release.apk"
          cert=$(keytool -printcert -jarfile "$aab")
          owner=$(echo "$cert" | grep -m1 'Owner:' || true)
          if [ "$FLAVOR" = prod ] && ! echo "$owner" | grep -q 'Battleplan'; then
            echo "::error::The prod App Bundle isn't signed with the upload key ($owner)."
            exit 1
          fi
          {
            echo "### Android $FLAVOR build $BUILD_NUMBER"
            echo
            echo "Signed by: ${owner#*Owner: }"
            echo
            echo '```'
            echo "$cert" | grep -E 'SHA1:|SHA256:'
            echo '```'
            echo
            echo "Firebase needs the SHA-1 and SHA-256 (Project settings, the Android app) for Google sign-in on this build."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          cp "$aab" "out/battleplan-$FLAVOR-$BUILD_NUMBER.aab"
          cp "$apk" "out/battleplan-$FLAVOR-$BUILD_NUMBER.apk"

      - name: End-to-end test APK
        if: inputs.e2e && inputs.flavor == 'dev'
        run: |
          flutter build apk --debug --flavor dev \
            -t integration_test/e2e_test.dart --dart-define=USE_EMULATORS=true
          cp build/app/outputs/flutter-apk/app-dev-debug.apk \
            "out/battleplan-dev-$BUILD_NUMBER-e2e.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: battleplan-android-${{ inputs.flavor }}-${{ env.BUILD_NUMBER }}
          path: out/
          retention-days: 30
