name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run it again on a commit from the Actions tab: every job runs, whatever
  # changed, and on main it deploys everything to dev.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

# Every job has a timeout-minutes several times its usual length. Left to
# GitHub's own limit a job that hangs runs six hours, and in a private
# repository those are billed minutes.
#
# The App job, the Web build and the Functions job can run on the owner's
# Mac instead, at no charge (ROADMAP task 486, DEVELOPMENT.md "Building on
# your Mac"): when the repository variable CI_ON_MAC is on, the repository is
# private, and the run isn't for a pull request, they ask for the runner
# tools/setup_mac_runner.sh set up (label battleplan). What changed and the
# deploys stay on GitHub's machines, so the sign-in to Google never happens
# on the Mac. The jobs take turns there, and wait while it's asleep. So
# their steps work on both: no GNU-only commands, and the platform's PDFium.
jobs:
  # Which jobs this push needs, from the files that changed since the last
  # commit CI passed on (tools/ci_changes.sh, ARCH §9): a website edit skips
  # the app's and the server's tests, an app change skips the server's, and
  # the deploy to dev sends only the parts that changed. A pull request, a
  # run started by hand, and anything it can't sort out run everything; so
  # the jobs below ask whether it said "false", and run if it said nothing.
  # It needs the history but no files' contents, so it clones without them
  # and checks out only its script.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To ask which CI run passed last.
      actions: read
    outputs:
      app: ${{ steps.changes.outputs.app }}
      functions: ${{ steps.changes.outputs.functions }}
      web: ${{ steps.changes.outputs.web }}
      rules: ${{ steps.changes.outputs.rules }}
      fdeploy: ${{ steps.changes.outputs.fdeploy }}
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: tools/ci_changes.sh
          sparse-checkout-cone-mode: false
      - name: What this run checks
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci_changes.sh

  # The app's checks and then its tests, in one job: a private repository
  # is billed for each job's minutes, each rounded up, and a second job would
  # set Flutter up a second time; and this way a formatting or analyzer
  # failure stops the run before the tests, its longest part.
  app:
    name: App (format, analyze, test)
    needs: changes
    if: needs.changes.outputs.app != 'false'
    runs-on: ${{ vars.CI_ON_MAC == 'on' && github.event.repository.private && github.event_name != 'pull_request' && fromJSON('["self-hosted", "macOS", "battleplan"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # On the Mac, Flutter stays in the runner's folder between runs.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ runner.environment == 'github-hosted' }}
      # Keeps pdfium_dart's PDFium download between runs: GitHub's release
      # downloads sometimes answer 504 for minutes (2026-11-09).
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pdfium-${{ runner.os }}-
      - name: PDFium for the build, ahead of pdfium_dart's own download
        env:
          GH_TOKEN: ${{ github.token }}
          # This machine's: linux-x64 on GitHub's, mac-arm64 on the Mac.
          PDFIUM_TARGET: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && 'mac-arm64' || 'mac-x64') || 'linux-x64' }}
        run: tools/fill_pdfium.sh "$PDFIUM_TARGET" || echo "::warning::Couldn't fetch PDFium ahead; the build tries itself."
      - run: flutter pub get
      - name: Shared constants are up to date
        run: dart run tools/gen_constants.dart --check
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -vE '\.(g|freezed)\.dart$|^lib/l10n/gen/')
      - run: flutter analyze
      - name: Import boundaries (ENG-1)
        run: tools/check_imports.sh
      # The golden images compare on macOS only, so CI leaves them out.
      #
      # A test file runs on each of the machine's cores at once (GitHub's
      # machines have four for a public repository and two for a private
      # one); left to itself Flutter uses half of them. And the biggest files
      # go first: Flutter takes them in whatever order the disk lists them,
      # and when a long one came last (accessibility_test.dart is a quarter
      # of the whole run) the other cores sat idle until it finished. The
      # files are the ones `flutter test` finds by itself: every *_test.dart
      # under test/. getconf and wc, not nproc and find -printf, which the
      # Mac doesn't have.
      - name: Tests
        run: |
          # shellcheck disable=SC2046
          flutter test --coverage --exclude-tags golden --concurrency "$(getconf _NPROCESSORS_ONLN)" \
            $(find test -name '*_test.dart' -exec wc -c {} + | awk '$2 != "total" {print $1, $2}' | sort -rn | cut -d' ' -f2-)
      # At least 80% of the domain and data layers (SPEC §8.1).
      - name: Coverage of domain and data layers
        run: dart run tools/check_coverage.dart coverage/lcov.info --min=80

  # The Hosting site, built once for dev alongside the tests: the website at
  # the root and the app under /app (WASM), the same layout the deploys use
  # (ARCH §6.6, D40). The PR preview and the deploy to dev use this build.
  web:
    name: Web build
    needs: changes
    if: needs.changes.outputs.web != 'false'
    runs-on: ${{ vars.CI_ON_MAC == 'on' && github.event.repository.private && github.event_name != 'pull_request' && fromJSON('["self-hosted", "macOS", "battleplan"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # The whole history: the build number counts the commits (ARCH §9).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On the Mac, Flutter stays in the runner's folder between runs.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ runner.environment == 'github-hosted' }}
      # Keeps pdfium_dart's PDFium download between runs: GitHub's release
      # downloads sometimes answer 504 for minutes (2026-11-09).
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pdfium-${{ runner.os }}-
      - name: PDFium for the build, ahead of pdfium_dart's own download
        env:
          GH_TOKEN: ${{ github.token }}
          # This machine's: linux-x64 on GitHub's, mac-arm64 on the Mac.
          PDFIUM_TARGET: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && 'mac-arm64' || 'mac-x64') || 'linux-x64' }}
        run: tools/fill_pdfium.sh "$PDFIUM_TARGET" || echo "::warning::Couldn't fetch PDFium ahead; the build tries itself."
      - name: Hosting build (website + web app under /app)
        run: tools/build_hosting.sh dev
        env:
          # Fills in apple-app-site-association once set (ROADMAP task 110).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # For the preview and the deploy below, minutes later. Kept a day, the
      # shortest GitHub allows: a private repository is billed for what its
      # runs keep beyond a small allowance, and this is 68 MB a push.
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-build
          path: build/hosting
          include-hidden-files: true
          retention-days: 1

  functions:
    name: Functions and security rules
    needs: changes
    if: needs.changes.outputs.functions != 'false'
    runs-on: ${{ vars.CI_ON_MAC == 'on' && github.event.repository.private && github.event_name != 'pull_request' && fromJSON('["self-hosted", "macOS", "battleplan"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # node_modules itself, kept between runs: `npm ci` takes about a minute
      # even with npm's downloads cached (setup-node above), most of it
      # unpacking. The lockfile says exactly what goes in it, so the folder
      # is kept under the lockfile's hash (and Node's version, which built
      # the packages that have compiled parts), and saved right after
      # `npm ci`, before any tool writes its own files there.
      - id: modules
        uses: actions/cache/restore@v4
        with:
          path: functions/node_modules
          key: functions-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('functions/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: functions/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Rules and emulator tests, with the unit tests again for coverage: at
      # least 80% of the server's domain and data code (SPEC §8.1).
      - name: Rules tests on the emulator, with coverage
        run: npx --yes firebase-tools@15 emulators:exec --only auth,firestore,storage --project demo-battleplan 'npm run test:coverage'
      - name: Demo seed tests (SPEC §10)
        working-directory: tools/seed
        # The emulator runs the migration and demo-seed tests that need a
        # database; without it those tests skip.
        run: npm ci && npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-battleplan 'npm test'

  # Deploys use keyless Workload Identity Federation (ARCH §9). They turn on
  # once the repository variables FIREBASE_DEPLOYS=true, WIF_PROVIDER, and
  # WIF_SERVICE_ACCOUNT are set. After turning them on, start CI by hand once
  # (Run workflow), which deploys everything: a push sends only what changed
  # since CI last passed.

  # Web preview per PR.
  preview:
    name: Web preview
    # Only pull requests from this repo: a fork's can't sign in to deploy.
    if: github.event_name == 'pull_request' && vars.FIREBASE_DEPLOYS == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [app, functions, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # The Web build job's site, not a second build.
      - uses: actions/download-artifact@v4
        with:
          name: hosting-build
          path: build/hosting
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Deploy to a preview channel
        id: deploy
        run: |
          url=$(npx --yes firebase-tools@15 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project battleplan-dev-ecce4 --expires 7d --json | jq -r '.result[].url' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "Web preview: website ${{ steps.deploy.outputs.url }}/ · app ${{ steps.deploy.outputs.url }}/app/"

  # Every push to main deploys to the dev project what it changed: Firestore
  # rules and indexes and Storage rules, Functions, and the web app, in that
  # order, so dev's web app never calls a function that isn't there yet (a
  # new Dues build once met three-week-old Functions: "Couldn't save"). A
  # part nothing changed in stays as dev has it: the last run that passed
  # left it there, and a push after a failed or canceled run is compared
  # with that one, so nothing is left behind (tools/ci_changes.sh, which
  # says when it can't count on that and sends everything). A run started
  # by hand deploys all three, as does the first push after a Release to dev
  # (release-dev.yml), which deploys everything by hand, for any branch.
  deploy-dev:
    name: Deploy to dev
    # After the checks this push needed. One it didn't need is skipped, and a
    # job that needs a skipped job is skipped too unless it says otherwise,
    # so this names each one: passed or not needed, never failed or canceled.
    if: >-
      ${{
        !cancelled()
        && needs.changes.result == 'success'
        && needs.changes.outputs.deploy != 'false'
        && (needs.app.result == 'success' || needs.app.result == 'skipped')
        && (needs.functions.result == 'success' || needs.functions.result == 'skipped')
        && (needs.web.result == 'success' || needs.web.result == 'skipped')
        && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && github.ref == 'refs/heads/main'
        && vars.FIREBASE_DEPLOYS == 'true'
      }}
    needs: [changes, app, functions, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # The Web build job's site, not a second build.
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.web != 'false'
        with:
          name: hosting-build
          path: build/hosting
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # From the lockfile; Functions need no package's install scripts. Only
      # the Functions deploy reads them: the rules and Hosting deploy without.
      - name: Functions dependencies
        if: needs.changes.outputs.fdeploy != 'false'
        run: npm ci --prefix functions --ignore-scripts
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Deploy rules
        if: needs.changes.outputs.rules != 'false'
        run: npx --yes firebase-tools@15 deploy --only firestore:rules,firestore:indexes,storage --project battleplan-dev-ecce4 --non-interactive
      - name: Deploy Functions
        if: needs.changes.outputs.fdeploy != 'false'
        run: |
          # As in release.yml: Google's quota can stop a big deploy for a
          # minute; then try again (unchanged functions are skipped). Any
          # other failure stops at once.
          set -o pipefail
          log=$(mktemp)
          for attempt in 1 2 3; do
            if npx --yes firebase-tools@15 deploy --only functions --project battleplan-dev-ecce4 --non-interactive \
              --message "CI ${GITHUB_SHA:0:7}" 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -qiE 'quota|429|RESOURCE_EXHAUSTED|rate limit' "$log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Google's quota stopped the deploy (try $attempt of 3); trying again in 90 seconds."
              sleep 90
            fi
          done
          exit 1
      - name: Deploy hosting
        if: needs.changes.outputs.web != 'false'
        run: npx --yes firebase-tools@15 deploy --only hosting --project battleplan-dev-ecce4 --non-interactive
