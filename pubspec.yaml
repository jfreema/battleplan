name: battleplan
description: "Messaging and scheduling for sports teams."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  add_2_calendar: ^3.1.1
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  file_picker: ^13.1.0
  firebase_analytics: ^12.6.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_remote_config: ^6.7.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.6.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  pdfrx: ^2.6.5
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.2
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  firebase_storage_mocks: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mock_exceptions: ^0.8.2
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  generate: true

# App icons and splash screens from the placeholder mark on #2F5BEA (SPEC
# §7.1, Q9). Regenerate with tools/brand_icons.sh.
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  adaptive_icon_background: "#2F5BEA"
  # The tool insets these 16% into the adaptive icon's safe zone.
  adaptive_icon_foreground: assets/brand/foreground.png
  adaptive_icon_monochrome: assets/brand/foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#2F5BEA"
    theme_color: "#2F5BEA"

flutter_native_splash:
  color: "#2F5BEA"
  image: assets/brand/mark.png
  android_12:
    color: "#2F5BEA"
    image: assets/brand/mark.png
    icon_background_color: "#2F5BEA"
  # The web app keeps its own loading screen in web/index.html (ARCH §5.6).
  web: false
