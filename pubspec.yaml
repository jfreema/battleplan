  material_ui: ^1.6.0
  package_info_plus: ^10.2.2
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
