<!doctype html>
<!-- Google Play feature graphic (1024 x 500), Open Field, Army green. Render with headless Chrome:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --allow-file-access-from-files --window-size=1024,500 \
    --virtual-time-budget=3000 --screenshot=$PWD/store/google-play/feature-graphic.png \
    file://$PWD/store/google-play/feature-graphic.html -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(../../assets/fonts/lilita_one/LilitaOne-Regular.ttf)}
@font-face{font-family:Fredoka;font-weight:600;src:url(../../assets/fonts/fredoka/Fredoka-SemiBold.ttf)}
@font-face{font-family:Nunito;font-weight:800;src:url(../../assets/fonts/nunito/Nunito-ExtraBold.ttf)}
@font-face{font-family:Stencil;src:url(../../assets/fonts/black_ops_one/BlackOpsOne-Regular.ttf)}
*{box-sizing:border-box;margin:0}
html,body{width:1024px;height:500px;overflow:hidden;background:radial-gradient(circle at 30% 35%,#50552F,#474C2B 55%,#3D4124)}
body{position:relative;font-family:Nunito;font-weight:800;color:#F4EAD0}
.left{position:absolute;left:64px;top:84px;width:480px}
.brand{display:flex;align-items:center;gap:22px}
.tile{width:112px;height:112px;display:block}
h1{font-family:Lilita;font-weight:400;font-size:84px;line-height:1;color:#F4EAD0;text-shadow:5px 5px 0 #1A1A18}
.eyebrow{margin:30px 0 0 4px;font-family:Stencil;font-size:22px;letter-spacing:.12em;color:#F7A29A}
.tag{margin-top:14px;font-size:27px;line-height:1.3;color:#F4EAD0;opacity:.85}
.right{position:absolute;left:590px;top:56px;width:374px}
.box{border:3px solid #1A1A18;box-shadow:5px 5px 0 #1A1A18}
.bubble{background:#F4EAD0;color:#1A1A18;border-radius:22px 22px 6px 22px;padding:12px 18px;font-size:20px;line-height:1.3;margin-left:60px;transform:rotate(1.5deg)}
.bubble .who{font-family:Fredoka;font-weight:600;font-size:15px;opacity:.7;margin-bottom:2px}
.card{background:#575A3A;color:#F4EAD0;border-radius:22px;padding:16px 20px 18px;margin-top:24px;border-left:8px solid #F45B5B;transform:rotate(-1.5deg)}
.chips{display:flex;justify-content:space-between;align-items:center}
.chip{font-family:Stencil;font-size:15px;letter-spacing:.1em;color:#F7A29A}
.card h2{font-family:Lilita;font-weight:400;font-size:34px;line-height:1;margin-top:8px}
.card p{font-size:17px;margin-top:4px;opacity:.85}
.rsvp{display:flex;gap:10px;margin-top:24px}
.g{flex:1;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:600;font-size:18px;color:#1A1A18;background:var(--face)}
</style></head><body>
<div class="left">
  <div class="brand">
    <img class="tile" src="../../website/favicon.svg" alt="">
    <h1>Battleplan</h1>
  </div>
  <div class="eyebrow">FREE FOR EVERY TEAM</div>
  <p class="tag">Team chat, the schedule, and who's coming, all in one place.</p>
</div>

<div class="right">
  <div class="bubble box"><div class="who">Coach Rivera</div>Bring the white jerseys Saturday!</div>
  <div class="card box">
    <div class="chips"><span class="chip">GAME</span><span class="chip">IN 3 DAYS</span></div>
    <h2>vs. Hawks</h2>
    <p>Saturday, 10:00 AM · Field 2</p>
  </div>
  <div class="rsvp">
    <div class="g box" style="--face:#5BC27A">Going</div>
    <div class="g box" style="--face:#F2C14E">Maybe</div>
    <div class="g box" style="--face:#F45B5B">Not going</div>
  </div>
</div>
</body></html>
