<!DOCTYPE html>
<html lang="en">
<head>
  <!-- /app/ on Hosting (tools/build_hosting.sh): the website is at the root
       and the web app under /app (D40). Relative URLs below resolve under it. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Messaging and scheduling for sports teams.">
  <meta name="theme-color" content="#0E0E0D">
  <!-- The website is indexed; the web app isn't (WEB-5). -->
  <meta name="robots" content="noindex">
  <!-- Link previews in messaging apps: the website's card. An invite link
       gets its team's own from joinPage (ARCH §6.6). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Battleplan">
  <meta property="og:title" content="Battleplan">
  <meta property="og:description" content="Your team's chat, schedule and RSVPs, polls, and documents in one place.">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Every team needs a Battleplan: Thunder's schedule on five phones, one in each color scheme.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32"/>

  <title>Battleplan</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading screen until Flutter's first frame (ARCH §5.6). -->
  <style>
    /* Open Field's Dark page, the default color scheme (SET-2), so the
       first frame follows without a change of color. */
    :root { color-scheme: dark; --bg: #0E0E0D; --fg: #F4EAD0; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 600 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); transition: opacity 200ms ease;
    }
    #splash .mark { width: 72px; height: 72px; display: block; }
    @media (prefers-reduced-motion: no-preference) {
      #splash .mark { animation: pulse 1.2s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { transform: scale(0.92); } }
  </style>
</head>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 250);
    });
  </script>
