<!DOCTYPE html>
<html lang="en">
<head>
  <!-- /app/ on Hosting (tools/build_hosting.sh): the website is at the root
       and the web app under /app (D40). Relative URLs below resolve under it. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Messaging and scheduling for sports teams.">
  <meta name="theme-color" content="#0B1531">
  <!-- The website is indexed; the web app isn't (WEB-5). -->
  <meta name="robots" content="noindex">
  <!-- Link previews in messaging apps: the website's card. An invite link
       gets its team's own from joinPage (ARCH §6.6). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Battleplan">
  <meta property="og:title" content="Battleplan">
  <meta property="og:description" content="Your team's chat, schedule and RSVPs, polls, and documents in one place.">
  <meta property="og:image" content="https://getbattleplan.app/images/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Battleplan on a phone: team chat with a poll, and the team schedule.">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Battleplan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Battleplan</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading screen until Flutter's first frame (ARCH §5.6). -->
  <style>
    /* Gumdrop Pop Dark's page, the app's default theme. */
    :root { color-scheme: dark; --bg: #0B1531; --fg: #F2F6FF; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 600 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); transition: opacity 200ms ease;
    }
    #splash .mark { width: 72px; height: 72px; display: block; }
    @media (prefers-reduced-motion: no-preference) {
      #splash .mark { animation: pulse 1.2s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { transform: scale(0.92); } }
  </style>
</head>
<body>
  <!-- The brand mark, as in the favicon and app icon (SPEC §7.1). -->
  <div id="splash" aria-label="Loading Battleplan"><svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true"><defs><radialGradient id="bp-crest-bg" cx="0.5" cy="0.3" r="0.82"><stop offset="0" stop-color="#6DB3FF"/><stop offset="1" stop-color="#2F6FDE"/></radialGradient></defs><rect width="1024" height="1024" rx="224" fill="url(#bp-crest-bg)"/><g transform="translate(512 512) scale(1.1) translate(-512 -512)"><g transform="translate(-16 -26) rotate(-7 512 512)"><path d="M240 196L784 196Q832 196 832 244L832 492C832 700 694 808 512 862C330 808 192 700 192 492L192 244Q192 196 240 196Z" fill="#0B1531" stroke="#0B1531" stroke-width="36" stroke-linejoin="round" transform="translate(40 40)"/><path d="M240 196L784 196Q832 196 832 244L832 492C832 700 694 808 512 862C330 808 192 700 192 492L192 244Q192 196 240 196Z" fill="#FFD84A" stroke="#0B1531" stroke-width="36" stroke-linejoin="round"/><path d="M371 337L653 337Q725 337 725 409L725 539Q725 611 653 611L476 611L392 688L406 611L371 611Q299 611 299 539L299 409Q299 337 371 337Z" fill="#FFFFFF" stroke="#0B1531" stroke-width="26" stroke-linejoin="round"/><path d="M565.7 433.8Q565.7 456.7 545.9 468.6Q556.7 472.5 563.9 482.2Q571.2 491.9 571.2 509.6Q571.2 527.3 558.1 537.7Q545 548 520.6 548L468.7 548Q464.9 548 462.5 545.5Q460.1 542.9 460.1 538.8L460.1 398Q460.1 395.5 460.8 394.8Q461.6 394 464 394L514.2 394Q565.7 394 565.7 433.8ZM502.3 429.6L502.3 458.5L503.4 458.5Q524.5 458.5 524.5 444.4Q524.5 436.7 520.5 433.2Q516.4 429.6 506.9 429.6ZM502.3 484.4L502.3 513L506.3 513Q515.7 513 520.1 509.5Q524.5 506 524.5 498.3Q524.5 490.6 520.5 487.5Q516.4 484.4 506.9 484.4Z" fill="#0B1531"/></g></g></svg>Battleplan</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
