<!DOCTYPE html>
<html lang="en">
<head>
  <!-- /app/ on Hosting (tools/build_hosting.sh): the website is at the root
       and the web app under /app (D40). Relative URLs below resolve under it. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Messaging and scheduling for sports teams.">
  <meta name="theme-color" content="#0B1531">
  <!-- The website is indexed; the web app isn't (WEB-5). -->
  <meta name="robots" content="noindex">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Battleplan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Battleplan</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading screen until Flutter's first frame (ARCH §5.6). -->
  <style>
    /* Gumdrop Pop Dark's page, the app's default theme. */
    :root { color-scheme: dark; --bg: #0B1531; --fg: #F2F6FF; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 600 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); transition: opacity 200ms ease;
    }
    #splash .mark { width: 72px; height: 72px; display: block; }
    @media (prefers-reduced-motion: no-preference) {
      #splash .mark { animation: pulse 1.2s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { transform: scale(0.92); } }
  </style>
</head>
<body>
  <!-- The brand mark, as in the favicon and app icon (SPEC §7.1). -->
  <div id="splash" aria-label="Loading Battleplan"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#2F5BEA"/><g fill="#fff" transform="translate(256 266) scale(0.6) translate(-363 -347)"><path d="M60 660 108 75" stroke="#fff" stroke-width="48" stroke-linecap="round"/><circle cx="112" cy="52" r="42"/><path fill-rule="evenodd" d="M150 98C260 40 380 190 690 122L588 305 690 480C470 560 330 400 118 492ZM200 155H445L505 215V255L462 297 505 340V385L445 430H218L270 370H405L428 347 400 318H205L262 260H408L435 235 410 210H255Z"/></g></svg>Battleplan</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
